<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="100" height="100" rx="24" fill="#090d16" />
  <rect x="2" y="2" width="96" height="96" rx="22" fill="none" stroke="url(#grad)" stroke-width="2" opacity="0.6" />
  <!-- YouTube pill shape / Play button & subtitle lines -->
  <rect x="20" y="26" width="60" height="48" rx="14" fill="url(#grad)" filter="url(#glow)" />
  <polygon points="43,40 43,60 62,50" fill="#ffffff" />
  <!-- Soundwave / Caption lines below -->
  <line x1="28" y1="82" x2="38" y2="82" stroke="#6366f1" stroke-width="4" stroke-linecap="round" />
  <line x1="44" y1="82" x2="56" y2="82" stroke="#8b5cf6" stroke-width="4" stroke-linecap="round" />
  <line x1="62" y1="82" x2="72" y2="82" stroke="#ec4899" stroke-width="4" stroke-linecap="round" />
</svg>

